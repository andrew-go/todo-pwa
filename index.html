<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TODO</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TODO">
<style>
  :root {
    --bg: #f5f5f9;
    --card: #ffffff;
    --text: #1c1c28;
    --muted: #8a8aa0;
    --accent: #4f46e5;
    --border: #e4e4ee;
    --danger: #e5484d;
    --ok: #16a34a;
    --arch: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12121a;
      --card: #1c1c28;
      --text: #ececf4;
      --muted: #7c7c93;
      --border: #2c2c3c;
    }
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior-y: contain;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  button { font: inherit; cursor: pointer; color: inherit; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 28px; }
  .date { margin: 0; color: var(--muted); font-size: 14px; }
  .date::first-letter { text-transform: uppercase; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .ring { flex: none; }
  .ring .track { stroke: var(--border); }
  .ring .bar { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
  .ring text { fill: var(--text); font-size: 15px; font-weight: 600; }

  .seg { display: flex; gap: 4px; padding: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; }
  .seg button[data-view] { flex: 1; padding: 8px 4px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .seg button.active { background: var(--accent); color: #fff; }
  .seg .fs { flex: none; width: 40px; border: 0; border-radius: 9px; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }

  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 14px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); color: var(--text);
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .add { padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.swipe {
    position: relative; margin-bottom: 8px; border-radius: 12px; overflow: hidden;
    transition: height .22s ease, margin .22s ease, opacity .22s ease;
  }
  li.swipe.collapse { height: 0 !important; margin-bottom: 0; opacity: 0; }
  li.swipe.enter { animation: pop .28s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.97); } }
  .bg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; color: #fff; font-weight: 600; font-size: 14px;
  }
  li[data-dir="right"] .bg { background: var(--ok); }
  li[data-dir="left"] .bg { background: var(--arch); }
  li[data-dir="right"] .bg .r, li[data-dir="left"] .bg .l { visibility: hidden; }
  .row {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
    transition: transform .2s ease;
  }
  .row.drag { transition: none; }
  .check {
    flex: none; width: 26px; height: 26px; border-radius: 50%; padding: 0;
    border: 2px solid var(--muted); background: transparent; color: #fff;
    display: grid; place-items: center; font-size: 15px; line-height: 1;
  }
  .done .check { background: var(--accent); border-color: var(--accent); }
  .text { flex: 1; word-break: break-word; }
  .done .text { color: var(--muted); text-decoration: line-through; }
  .empty, .hint { text-align: center; color: var(--muted); font-size: 14px; }
  .empty { padding: 32px 0; font-size: 16px; }
  .hint { margin: 14px 0 0; }
  .link { display: block; margin: 8px auto 0; border: 0; background: none; color: var(--accent); font-size: 14px; padding: 6px; }
  .link.danger { color: var(--danger); }

  .donehead {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    margin: 16px 0 8px; padding: 10px 4px; border: 0; background: none; color: var(--muted); font-weight: 500;
  }

  .arow { display: block; }
  .arow .text { display: block; margin-bottom: 10px; }
  .abtns { display: flex; gap: 8px; }
  .abtns button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); font-size: 14px; }
  .abtns .del { color: var(--danger); border-color: var(--danger); }
  .arow { margin-bottom: 8px; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }

  .focus { display: flex; flex-direction: column; min-height: 60dvh; }
  .fcount { margin: 0; color: var(--muted); font-size: 14px; }
  .fbar { height: 4px; border-radius: 2px; background: var(--border); margin: 10px 0 0; overflow: hidden; }
  .fbar i { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  .fcard { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px 4px; }
  .ftext { margin: 0; font-size: 30px; line-height: 1.2; font-weight: 600; word-break: break-word; }
  .fcard.again .ftext { animation: pop .3s ease-out; }
  .fall { text-align: center; }
  .fall .big { font-size: 56px; color: var(--accent); }
  .fbtn { width: 100%; padding: 16px; border-radius: 14px; font-weight: 600; font-size: 17px; margin-top: 10px; }
  .fbtn.primary { border: 0; background: var(--accent); color: #fff; }
  .fbtn.ghost { border: 1px solid var(--border); background: var(--card); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Сьогодні</h1>
      <p class="date" id="date"></p>
      <p class="sub" id="sub"></p>
    </div>
    <svg class="ring" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Прогрес">
      <circle class="track" cx="32" cy="32" r="26" fill="none" stroke-width="6"/>
      <circle class="bar" id="bar" cx="32" cy="32" r="26" fill="none" stroke-width="6" stroke-linecap="round" transform="rotate(-90 32 32)"/>
      <text id="pct" x="32" y="37" text-anchor="middle"></text>
    </svg>
  </header>

  <div class="seg" id="seg">
    <button data-view="list" class="active">Список</button>
    <button data-view="focus">Фокус</button>
    <button data-view="archive" id="segArch">Архів</button>
    <button class="fs" id="fs" aria-label="На весь екран" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIcon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <section id="listView">
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Що потрібно зробити?" maxlength="200" aria-label="Нова задача">
      <button class="add" type="submit">Додати</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden></p>
    <p class="hint" id="hint" hidden>Свайп вправо — готово, вліво — в архів</p>

    <div id="doneBox" hidden>
      <button class="donehead" id="donehead"><span id="donetitle"></span><span id="donearrow">▾</span></button>
      <div id="donebody" hidden>
        <ul id="doneList"></ul>
        <button class="link" id="archiveDone">Перенести виконані в архів</button>
      </div>
    </div>
  </section>

  <section class="focus" id="focusView" hidden>
    <div>
      <p class="fcount" id="fcount"></p>
      <div class="fbar"><i id="fbar"></i></div>
    </div>
    <div class="fcard" id="fcard"></div>
    <div id="factions">
      <button class="fbtn primary" id="fdone">Готово</button>
      <button class="fbtn ghost" id="flater">Пізніше</button>
    </div>
  </section>

  <section id="archView" hidden>
    <p class="hint" style="margin:0 0 14px">Тут лежать задачі, які ви прибрали зі списку. Їх можна повернути або видалити назавжди.</p>
    <ul id="archList"></ul>
    <p class="empty" id="archEmpty" hidden>Архів порожній</p>
    <button class="link danger" id="archClear" hidden>Видалити все назавжди</button>
  </section>
</main>

<script>
  const KEY = 'todo.items.v1';
  const KEY_DONE = 'todo.showDone';
  const SWIPE = 90;
  const CIRC = 2 * Math.PI * 26;
  const $ = (id) => document.getElementById(id);

  let items = load();
  let view = 'list';
  let justAdded = null;
  let showDone = loadFlag(KEY_DONE);

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {}
  }
  function loadFlag(k) {
    try { return localStorage.getItem(k) === '1'; } catch { return false; }
  }
  function saveFlag(k, v) {
    try { localStorage.setItem(k, v ? '1' : '0'); } catch {}
  }

  const live = () => items.filter((t) => !t.archived);
  const active = () => live().filter((t) => !t.done);
  const finished = () => live().filter((t) => t.done);
  const archived = () => items.filter((t) => t.archived).sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));

  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  function confetti(x, y) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas');
    c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:10';
    c.width = innerWidth; c.height = innerHeight;
    document.body.append(c);
    const ctx = c.getContext('2d');
    const colors = ['#4f46e5', '#16a34a', '#f59e0b', '#e5484d', '#06b6d4'];
    const ps = Array.from({ length: 32 }, () => ({
      x, y, vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 2,
      s: 4 + Math.random() * 4, col: colors[(Math.random() * colors.length) | 0],
    }));
    let n = 0;
    (function frame() {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of ps) {
        p.vy += .38; p.x += p.vx; p.y += p.vy;
        ctx.fillStyle = p.col;
        ctx.fillRect(p.x, p.y, p.s, p.s);
      }
      if (++n < 55) requestAnimationFrame(frame); else c.remove();
    })();
  }

  function complete(t, x, y) {
    t.done = !t.done;
    if (t.done) { buzz(15); confetti(x, y); }
    save();
    render();
  }

  function toArchive(t, li, row) {
    buzz(10);
    row.style.transform = 'translateX(-110%)';
    li.style.height = li.offsetHeight + 'px';
    setTimeout(() => li.classList.add('collapse'), 120);
    setTimeout(() => { t.archived = true; t.archivedAt = Date.now(); save(); render(); }, 360);
  }

  function attachSwipe(li, row, t) {
    let sx = 0, sy = 0, dx = 0, id = null, dragging = false;

    const reset = () => {
      row.classList.remove('drag');
      row.style.transform = '';
      li.removeAttribute('data-dir');
      id = null; dragging = false;
    };

    row.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.check')) return;
      sx = e.clientX; sy = e.clientY; dx = 0; id = e.pointerId; dragging = false;
    });
    row.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      dx = e.clientX - sx;
      if (!dragging) {
        if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(e.clientY - sy)) return;
        dragging = true;
        row.setPointerCapture(id);
        row.classList.add('drag');
      }
      row.style.transform = `translateX(${dx}px)`;
      li.dataset.dir = dx > 0 ? 'right' : 'left';
    });
    const end = (e) => {
      if (e.pointerId !== id) return;
      const wasDragging = dragging, d = dx;
      if (wasDragging && d <= -SWIPE) { toArchive(t, li, row); id = null; return; }
      reset();
      if (wasDragging && d >= SWIPE) complete(t, e.clientX, e.clientY);
    };
    row.addEventListener('pointerup', end);
    row.addEventListener('pointercancel', (e) => { if (e.pointerId === id) reset(); });
  }

  function makeRow(t) {
    const li = document.createElement('li');
    li.className = 'swipe' + (t.id === justAdded ? ' enter' : '');

    const bg = document.createElement('div');
    bg.className = 'bg';
    const l = document.createElement('span');
    l.className = 'l';
    l.textContent = t.done ? '↺ Повернути' : '✓ Готово';
    const r = document.createElement('span');
    r.className = 'r';
    r.textContent = 'В архів';
    bg.append(l, r);

    const row = document.createElement('div');
    row.className = 'row' + (t.done ? ' done' : '');

    const check = document.createElement('button');
    check.className = 'check';
    check.setAttribute('aria-label', t.done ? 'Повернути до активних' : 'Позначити виконаною');
    check.textContent = t.done ? '✓' : '';
    check.onclick = (e) => complete(t, e.clientX, e.clientY);

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = t.text;

    row.append(check, text);
    li.append(bg, row);
    attachSwipe(li, row, t);
    return li;
  }

  function renderHeader() {
    const all = live();
    const done = finished().length;
    const ratio = all.length ? done / all.length : 0;
    $('bar').style.strokeDasharray = CIRC;
    $('bar').style.strokeDashoffset = CIRC * (1 - ratio);
    $('pct').textContent = Math.round(ratio * 100) + '%';
    $('sub').textContent = all.length ? `${done} з ${all.length} виконано` : 'Задач ще немає';
    $('date').textContent = new Date().toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
    const n = archived().length;
    $('segArch').textContent = n ? `Архів · ${n}` : 'Архів';
  }

  function renderList() {
    const list = $('list');
    list.textContent = '';
    for (const t of active()) list.append(makeRow(t));
    justAdded = null;

    const doneList = $('doneList');
    doneList.textContent = '';
    const fin = finished();
    for (const t of fin) doneList.append(makeRow(t));
    $('doneBox').hidden = fin.length === 0;
    $('donetitle').textContent = `Виконані (${fin.length})`;
    $('donearrow').textContent = showDone ? '▴' : '▾';
    $('donebody').hidden = !showDone;

    const empty = $('empty');
    const all = live().length;
    empty.hidden = active().length > 0;
    empty.textContent = all === 0 ? 'Поки що порожньо — додайте першу задачу' : 'Усе зроблено — так тримати!';
    $('hint').hidden = all === 0;
  }

  let lastFocusId = null;
  function renderFocus() {
    const todo = active();
    const fcard = $('fcard');
    const total = live().length;
    const done = total - todo.length;
    $('fbar').style.width = (total ? (done / total) * 100 : 0) + '%';
    fcard.textContent = '';
    fcard.className = 'fcard';

    if (!todo.length) {
      $('fcount').textContent = total ? 'Усе зроблено' : 'Задач ще немає';
      $('factions').hidden = true;
      const box = document.createElement('div');
      box.className = 'fall';
      const big = document.createElement('div');
      big.className = 'big';
      big.textContent = total ? '✓' : '＋';
      const p = document.createElement('p');
      p.textContent = total ? 'Чудова робота! Список порожній.' : 'Додайте задачі у вкладці «Список».';
      box.append(big, p);
      fcard.append(box);
      lastFocusId = null;
      return;
    }

    $('factions').hidden = false;
    $('flater').hidden = todo.length < 2;
    $('fcount').textContent = `Фокус · залишилось ${todo.length}`;
    const t = todo[0];
    const p = document.createElement('p');
    p.className = 'ftext';
    p.textContent = t.text;
    fcard.append(p);
    if (lastFocusId !== t.id) fcard.classList.add('again');
    lastFocusId = t.id;
  }

  function renderArchive() {
    const list = $('archList');
    list.textContent = '';
    const arch = archived();
    for (const t of arch) {
      const li = document.createElement('li');
      li.className = 'arow' + (t.done ? ' done' : '');

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = t.text;

      const btns = document.createElement('div');
      btns.className = 'abtns';

      const back = document.createElement('button');
      back.textContent = 'Повернути';
      back.onclick = () => { t.archived = false; delete t.archivedAt; save(); render(); };

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = 'Видалити назавжди';
      del.onclick = () => {
        if (!confirm('Видалити назавжди? Цю дію не можна скасувати.')) return;
        items = items.filter((x) => x !== t);
        save();
        render();
      };

      btns.append(back, del);
      li.append(text, btns);
      list.append(li);
    }
    $('archEmpty').hidden = arch.length > 0;
    $('archClear').hidden = arch.length === 0;
  }

  function render() {
    renderHeader();
    $('listView').hidden = view !== 'list';
    $('focusView').hidden = view !== 'focus';
    $('archView').hidden = view !== 'archive';
    for (const b of document.querySelectorAll('#seg button[data-view]')) {
      b.classList.toggle('active', b.dataset.view === view);
    }
    if (view === 'list') renderList();
    else if (view === 'focus') renderFocus();
    else renderArchive();
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    items.unshift({ id, text, done: false });
    justAdded = id;
    $('input').value = '';
    save();
    render();
  });

  $('seg').addEventListener('click', (e) => {
    const v = e.target.closest('button[data-view]')?.dataset.view;
    if (v) { view = v; lastFocusId = null; render(); }
  });

  $('donehead').onclick = () => { showDone = !showDone; saveFlag(KEY_DONE, showDone); render(); };

  $('archiveDone').onclick = () => {
    const now = Date.now();
    for (const t of finished()) { t.archived = true; t.archivedAt = now; }
    save();
    render();
  };

  $('archClear').onclick = () => {
    if (!confirm('Видалити весь архів назавжди? Цю дію не можна скасувати.')) return;
    items = items.filter((t) => !t.archived);
    save();
    render();
  };

  $('fdone').onclick = (e) => {
    const t = active()[0];
    if (t) complete(t, e.clientX, e.clientY);
  };
  $('flater').onclick = () => {
    const t = active()[0];
    if (!t) return;
    items = items.filter((x) => x !== t).concat(t);
    save();
    render();
  };

  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (document.fullscreenEnabled && !standalone) {
    const ENTER = 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5';
    const EXIT = 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5';
    $('fs').hidden = false;
    $('fs').onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    };
    document.addEventListener('fullscreenchange', () => {
      const on = !!document.fullscreenElement;
      $('fsIcon').setAttribute('d', on ? EXIT : ENTER);
      $('fs').setAttribute('aria-label', on ? 'Вийти з повного екрана' : 'На весь екран');
    });
  }

  render();

  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
